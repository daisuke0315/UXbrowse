<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ViewSync 3DGS Reference Renderer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: fixed; inset: 0 auto auto 0; z-index: 2; padding: 8px; color: white; background: #900; font: 14px monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="status">booting</div>
  <canvas id="application-canvas"></canvas>
  <script>
    window.addEventListener('error', event => {
      document.getElementById('status').textContent = `error: ${event.message}\n${event.error?.stack || ''}`;
    });
    window.addEventListener('unhandledrejection', event => {
      document.getElementById('status').textContent = `rejection: ${event.reason?.stack || event.reason}`;
    });
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
