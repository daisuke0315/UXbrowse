<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ViewSync MPR</title>
    <link rel="stylesheet" href="./src/styles.css?v=mpr-fov-sliders-1">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup" aria-label="ViewSync MPR">
          <svg class="brand-mark" viewBox="0 0 48 48" role="img" aria-labelledby="brandTitle brandDesc">
            <title id="brandTitle">ViewSync MPR</title>
            <desc id="brandDesc">A synchronized viewing plane crossing a three-dimensional volume.</desc>
            <defs>
              <linearGradient id="brandPlaneGradient" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#67e8f9"/>
                <stop offset="0.55" stop-color="#2dd4bf"/>
                <stop offset="1" stop-color="#818cf8"/>
              </linearGradient>
            </defs>
            <path class="brand-volume" d="M24 4.5 40.5 14v20L24 43.5 7.5 34V14L24 4.5Z"/>
            <path class="brand-plane" d="M10.5 27.2 24 19.3l13.5 7.9L24 35.1 10.5 27.2Z"/>
            <path class="brand-orbit" d="M9.5 18.5c5.2-8.3 21.3-8.3 29 0"/>
            <path class="brand-orbit brand-orbit-lower" d="M38.5 29.5c-5.2 8.3-21.3 8.3-29 0"/>
            <circle class="brand-focus" cx="24" cy="27.2" r="3.2"/>
          </svg>
          <div>
            <h1>ViewSync MPR</h1>
            <p id="statusText">DICOM CTシリーズを選択してください。</p>
          </div>
        </div>
        <details class="file-menu">
          <summary>データ読込</summary>
          <div class="file-actions">
            <section class="file-category file-category-volume" aria-labelledby="volumeDataHeading">
              <div class="file-category-heading">
                <span class="file-category-mark" aria-hidden="true"></span>
                <div>
                  <strong id="volumeDataHeading">DICOM / ボリューム</strong>
                  <small>CT断面データを読み込む</small>
                </div>
              </div>
              <div class="file-category-buttons">
                <label class="file-button">
                  DICOMフォルダ
                  <input id="folderInput" type="file" multiple webkitdirectory>
                </label>
                <label class="file-button">
                  DICOMファイル
                  <input id="fileInput" type="file" multiple>
                </label>
                <label class="file-button">
                  MHAファイル
                  <input id="mhaInput" type="file" accept=".mha">
                </label>
                <button id="demoVolumeBtn" type="button">デモファントム</button>
              </div>
            </section>

            <section class="file-category file-category-model" aria-labelledby="modelDataHeading">
              <div class="file-category-heading">
                <span class="file-category-mark" aria-hidden="true"></span>
                <div>
                  <strong id="modelDataHeading">3Dモデル</strong>
                  <small>重畳する形状・テクスチャ</small>
                </div>
              </div>
              <div class="file-category-buttons">
                <label class="file-button">
                  GLBモデル
                  <input id="glbInput" type="file" accept=".glb,model/gltf-binary">
                </label>
                <label class="file-button">
                  GLB＋テクスチャ
                  <input id="glbFolderInput" type="file" multiple webkitdirectory>
                </label>
                <label class="file-button">
                  OBJモデル
                  <input id="objInput" type="file" accept=".obj,model/obj,text/plain">
                </label>
                <label class="file-button">
                  テクスチャ画像
                  <input id="textureInput" type="file" accept="image/png,image/jpeg,image/webp">
                </label>
              </div>
            </section>
          </div>
        </details>
      </header>

      <section class="series-band" aria-label="シリーズ情報">
        <div><span>Series</span><strong id="seriesUid">-</strong></div>
        <div><span>Dimensions</span><strong id="volumeDimensions">-</strong></div>
        <div><span>Spacing</span><strong id="volumeSpacing">-</strong></div>
        <div><span>Value Range</span><strong id="huRange">-</strong></div>
      </section>

      <section class="workspace controls-collapsed">
        <button id="controlsToggleBtn" class="controls-toggle" type="button" aria-expanded="false">For Specialist</button>
        <div class="viewer-pane">
          <div class="three-pane">
            <div id="threeViewport" class="three-viewport" aria-label="Three.js表示領域">
              <div class="three-placeholder">Three.jsを初期化中...</div>
            </div>
            <div class="mpr-pane" aria-label="MPRサブ画面">
              <div class="mpr-pane-header">
                <strong>MPR</strong>
                <div class="mpr-pane-actions">
                  <button id="mprCollapseBtn" type="button" aria-pressed="false" aria-label="MPRを最小化">−</button>
                  <button id="mprExpandBtn" type="button" aria-pressed="false" aria-label="MPRを拡大">拡大</button>
                </div>
              </div>
              <canvas id="mprCanvas" width="512" height="512" aria-label="MPR画像"></canvas>
            </div>
          </div>
        </div>

        <aside class="controls-pane">
          <details class="control-group">
            <summary>基本操作</summary>
          <fieldset>
            <legend>Dynamic</legend>
            <label class="checkbox-label">
              <input id="dynamicToggle" type="checkbox" checked>
              Three.js連動
            </label>
            <label>更新間隔 ms <input id="updateInterval" type="number" min="16" step="16" value="80"></label>
          </fieldset>

          <fieldset>
            <legend>操作感</legend>
            <label class="range-control" for="panSensitivity">
              <span>平行移動感度 <output id="panSensitivityValue" for="panSensitivity">0.20</output></span>
              <input id="panSensitivity" type="range" min="0.1" max="1" step="0.05" value="0.2">
            </label>
            <label class="range-control" for="controlInertia">
              <span>慣性 <output id="controlInertiaValue" for="controlInertia">0.80</output></span>
              <input id="controlInertia" type="range" min="0" max="1" step="0.05" value="0.8">
            </label>
          </fieldset>

          <div class="control-row presets">
            <button id="axialBtn" type="button">Axial</button>
            <button id="coronalBtn" type="button">Coronal</button>
            <button id="sagittalBtn" type="button">Sagittal</button>
          </div>
          </details>

          <details class="control-group">
            <summary>可視光モデル</summary>
          <fieldset>
            <legend>可視光モデル</legend>
            <label class="checkbox-label">
              <input id="objMprToggle" type="checkbox" checked>
              モデル連動MPR
            </label>
            <label class="checkbox-label">
              <input id="objCenterToggle" type="checkbox">
              注視点へ中心合わせ
            </label>
            <label>Scale <input id="objScale" type="number" min="0.001" step="0.1" value="1"></label>
            <label class="range-control" for="objOpacity">
              <span>Opacity <output id="objOpacityValue" for="objOpacity">1.00</output></span>
              <input id="objOpacity" type="range" min="0.05" max="1" step="0.05" value="1">
            </label>
            <label>注視点距離/MPR距離 <input id="objMprDistance" type="number" min="1" step="10" value="600"></label>
            <div class="axis-grid">
              <span>位置</span>
              <label>X <input id="objPosX" type="number" step="1" value="0"></label>
              <label>Y <input id="objPosY" type="number" step="1" value="0"></label>
              <label>Z <input id="objPosZ" type="number" step="1" value="0"></label>
            </div>
            <div class="axis-grid">
              <span>回転</span>
              <label>X <input id="objRotX" type="number" step="5" value="0"></label>
              <label>Y <input id="objRotY" type="number" step="5" value="0"></label>
              <label>Z <input id="objRotZ" type="number" step="5" value="0"></label>
            </div>
            <div class="control-row">
              <button id="demoObjBtn" type="button">モデルデモ</button>
              <button id="clearObjBtn" type="button">モデル消去</button>
            </div>
          </fieldset>

          </details>

          <details class="control-group">
            <summary>カメラ詳細</summary>
          <fieldset>
            <legend>eye</legend>
            <div class="vector-grid" data-vector="eye"></div>
          </fieldset>

          <fieldset>
            <legend>target</legend>
            <div class="vector-grid" data-vector="target"></div>
          </fieldset>

          <fieldset>
            <legend>up</legend>
            <div class="vector-grid" data-vector="up"></div>
          </fieldset>
          </details>

          <details class="control-group">
            <summary>MPR / CT</summary>
          <fieldset>
            <legend>CT座標反転</legend>
            <div class="control-row">
              <button id="flipVolumeXBtn" type="button" aria-pressed="false">X反転</button>
              <button id="flipVolumeYBtn" type="button" aria-pressed="false">Y反転</button>
              <button id="flipVolumeZBtn" type="button" aria-pressed="false">Z反転</button>
              <button id="resetVolumeFlipBtn" type="button">反転リセット</button>
            </div>
          </fieldset>

          <fieldset>
            <legend>Window</legend>
            <label>WL <input id="windowLevel" type="number" step="1" value="40"></label>
            <label>WW <input id="windowWidth" type="number" step="1" min="1" value="400"></label>
            <select id="windowPreset">
              <option value="">プリセット</option>
              <option value="soft">軟部条件</option>
              <option value="lung">肺野条件</option>
              <option value="bone">骨条件</option>
              <option value="dicom">DICOM初期値</option>
              <option value="minmax">Min-Max</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>MPR</legend>
            <label class="checkbox-label">
              <input id="mprPlaneToggle" type="checkbox" checked>
              MPRプレーン表示
            </label>
            <p class="control-subheading">重畳矩形</p>
            <label class="range-control" for="mprFovWidth">
              <span>重畳範囲 幅 <output id="mprFovWidthValue" for="mprFovWidth">512 mm</output></span>
              <input id="mprFovWidth" type="range" min="50" max="1200" step="1" value="512">
            </label>
            <label class="range-control" for="mprFovHeight">
              <span>重畳範囲 高さ <output id="mprFovHeightValue" for="mprFovHeight">512 mm</output></span>
              <input id="mprFovHeight" type="range" min="50" max="1200" step="1" value="512">
            </label>
            <label class="range-control" for="mprPlaneOpacity">
              <span>MPR Opacity <output id="mprPlaneOpacityValue" for="mprPlaneOpacity">1.00</output></span>
              <input id="mprPlaneOpacity" type="range" min="0" max="1" step="0.05" value="1">
            </label>
            <label>重畳方式
              <select id="mprPlaneMode">
                <option value="world">World Plane</option>
                <option value="camera">Camera Plane</option>
              </select>
            </label>
            <label>Camera Plane距離 mm <input id="mprCameraPlaneDistance" type="number" min="0" step="1" value="0"></label>
            <div class="control-row">
              <button id="mprFlipUBtn" type="button" aria-pressed="false">重畳 U反転: OFF</button>
              <button id="mprFlipVBtn" type="button" aria-pressed="true">重畳 V反転: ON</button>
              <button id="mprFlipResetBtn" type="button">重畳 UVリセット</button>
            </div>
            <label class="checkbox-label">
              <input id="mprPlaneBoundaryToggle" type="checkbox" checked>
              境界線表示
            </label>
            <label class="checkbox-label">
              <input id="foregroundFadeToggle" type="checkbox" checked>
              前景透過
            </label>
            <label class="range-control" for="foregroundAlpha">
              <span>前景Alpha（0=切断） <output id="foregroundAlphaValue" for="foregroundAlpha">0.00</output></span>
              <input id="foregroundAlpha" type="range" min="0" max="1" step="0.05" value="0">
            </label>
            <label class="range-control" for="foregroundDistance">
              <span>前景透過距離 <output id="foregroundDistanceValue" for="foregroundDistance">0 mm</output></span>
              <input id="foregroundDistance" type="range" min="0" max="2000" step="5" value="0">
            </label>
            <label class="range-control" for="foregroundFadeWidth">
              <span>フェード幅 <output id="foregroundFadeWidthValue" for="foregroundFadeWidth">10 mm</output></span>
              <input id="foregroundFadeWidth" type="range" min="0" max="100" step="1" value="10">
            </label>
            <label class="checkbox-label">
              <input id="mprThresholdAlphaToggle" type="checkbox" checked>
              CT値しきい値透過
            </label>
            <label>透過しきい値 <input id="mprTransparentThreshold" type="number" step="10" value="-500"></label>
            <p class="control-subheading">画像生成詳細</p>
            <label>解像度 幅px <input id="mprWidth" type="number" min="32" max="2048" step="16" value="512"></label>
            <label>解像度 高さpx <input id="mprHeight" type="number" min="32" max="2048" step="16" value="512"></label>
            <label>画素間隔 U <input id="spacingU" type="number" min="0.05" step="0.05" value="1"></label>
            <label>画素間隔 V <input id="spacingV" type="number" min="0.05" step="0.05" value="1"></label>
            <label>法線移動 mm <input id="normalOffset" type="number" step="0.5" value="0"></label>
            <label>補間
              <select id="interpolation">
                <option value="linear">三線形</option>
                <option value="nearest">最近傍</option>
              </select>
            </label>
          </fieldset>
          </details>

          <div class="control-row">
            <button id="renderBtn" type="button">再計算</button>
            <button id="resetBtn" type="button">リセット</button>
          </div>
        </aside>
      </section>

      <details class="debug-drawer">
        <summary>デバッグ・ログ</summary>
        <section class="debug-band">
          <pre id="debugInfo"></pre>
          <pre id="logOutput"></pre>
        </section>
      </details>
      <pre id="diagnosticsOutput" hidden></pre>
    </main>

    <script type="module" src="./src/main.js?v=restore-alpha-hash-1"></script>
  </body>
</html>
