<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>browser-mpr tests</title>
    <style>
      body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #101418; color: #e6edf3; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <pre id="output">running...</pre>
    <script type="module">
      import { MprPlaneCalculator } from "./src/MprPlaneCalculator.js";
      import { CoordinateTransformer } from "./src/CoordinateTransformer.js";
      import { Interpolator } from "./src/Interpolator.js";
      import { MhaLoader } from "./src/MhaLoader.js";
      import { WindowingProcessor } from "./src/WindowingProcessor.js";
      import { volumeCenter, volumeVoxelCenterSpan } from "./src/VolumeGeometry.js";
      import { ThreeDicomCoordinateMapper } from "./src/three/ThreeDicomCoordinateMapper.js";
      import { ThreeSceneManager, calculateRequiredCameraFar, calculateRequiredCameraNear, resolveLocalGltfResource } from "./src/three/ThreeSceneManager.js?v=double-sided-depth";
      import { dot, length } from "./src/math3d.js";
      import { calculateValidationError } from "./src/validation/ValidationController.js?v=phase1-1";

      const lines = [];
      function assert(name, condition, details = "") {
        if (!condition) throw new Error(`${name} failed ${details}`);
        lines.push(`PASS ${name}`);
      }
      function close(a, b, eps = 1e-6) {
        return Math.abs(a - b) <= eps;
      }

      const plane = new MprPlaneCalculator().calculate({
        eye: [0, 0, -10],
        target: [0, 0, 0],
        up: [0, 1, 0],
      });
      assert("UT-001 n", close(plane.n[2], 1));
      assert("UT-002 unit", close(length(plane.u), 1) && close(length(plane.v), 1) && close(length(plane.n), 1));
      assert("UT-002 orthogonal", close(dot(plane.u, plane.v), 0) && close(dot(plane.v, plane.n), 0) && close(dot(plane.n, plane.u), 0));

      const metadata = {
        dimensions: [4, 4, 4],
        origin: [10, 20, 30],
        spacing: [2, 3, 4],
        direction: [1, 0, 0, 0, 1, 0, 0, 0, 1],
        inverseDirection: [1, 0, 0, 0, 1, 0, 0, 0, 1],
      };
      const transformer = new CoordinateTransformer(metadata);
      const voxel = transformer.worldToVoxel([14, 29, 38]);
      assert("UT-003 worldToVoxel", close(voxel[0], 2) && close(voxel[1], 3) && close(voxel[2], 2));
      assert("UT-003 volume center", volumeCenter(metadata).every((v, i) => close(v, [13, 24.5, 36][i])));
      assert("UT-003 voxel center span", volumeVoxelCenterSpan(metadata).every((v, i) => close(v, [6, 9, 12][i])));

      const data = new Int16Array(8);
      for (let i = 0; i < data.length; i += 1) data[i] = i;
      const interpolator = new Interpolator({ data, metadata: { dimensions: [2, 2, 2] } }, -1024);
      assert("UT-004 nearest", interpolator.nearest(1, 1, 1) === 7);
      assert("UT-004 linear", close(interpolator.linear(0.5, 0.5, 0.5), 3.5));

      const windowing = new WindowingProcessor();
      assert("UT-005 window lower", windowing.apply(-160, 40, 400) === 0);
      assert("UT-005 window upper", windowing.apply(240, 40, 400) === 255);
      assert("UT-005 window center", close(windowing.apply(40, 40, 400), 128, 1));

      const mapper = new ThreeDicomCoordinateMapper([
        1, 0, 0, 10,
        0, 2, 0, 20,
        0, 0, 3, 30,
        0, 0, 0, 1,
      ]);
      const mappedPoint = mapper.threePointToDicom([1, 2, 3]);
      assert("UT-110 origin transform", mapper.threePointToDicom([0, 0, 0]).every((v, i) => close(v, [10, 20, 30][i])));
      assert("UT-112 point transform", mappedPoint.every((v, i) => close(v, [11, 24, 39][i])));
      assert("UT-113 vector ignores translation", mapper.threeVectorToDicom([0, 0, 1]).every((v, i) => close(v, [0, 0, 1][i])));
      const roundTrip = mapper.dicomPointToThree(mappedPoint);
      assert("UT-114 inverse transform", roundTrip.every((v, i) => close(v, [1, 2, 3][i])));

      const localGlbFiles = [
        { name: "model.glb", webkitRelativePath: "case/model.glb" },
        { name: "diffuse.png", webkitRelativePath: "case/diffuse.png" },
        { name: "normal.png", webkitRelativePath: "case/textures/normal.png" },
      ];
      assert("UT-120 GLB sibling resource", resolveLocalGltfResource(localGlbFiles, localGlbFiles[0], "diffuse.png") === localGlbFiles[1]);
      assert("UT-121 GLB nested resource", resolveLocalGltfResource(localGlbFiles, localGlbFiles[0], "textures/normal.png") === localGlbFiles[2]);
      assert("UT-122 GLB missing resource", resolveLocalGltfResource(localGlbFiles, localGlbFiles[0], "missing.png") === null);
      assert("UT-123 camera far minimum", calculateRequiredCameraFar([0, 0, 0], [0, 0, 0], 100) === 5000);
      assert("UT-124 camera far follows distance", close(calculateRequiredCameraFar([0, 0, -6000], [0, 0, 0], 1000), 7700));
      assert("UT-125 camera near follows empty space", close(calculateRequiredCameraNear([0, 0, -6000], [0, 0, 0], 1000), 1250));
      assert("UT-126 camera near protects MPR", close(calculateRequiredCameraNear([0, 0, -6000], [0, 0, 0], 1000, 0.1, 1500), 375));

      const fakeSourceMaterial = {
        name: "photogrammetry",
        color: { clone: () => ({}) },
        map: null,
        alphaMap: null,
        vertexColors: false,
        transparent: false,
        alphaTest: 0,
        depthTest: true,
        depthWrite: true,
        blending: 1,
        fog: true,
        dispose() {},
      };
      class FakeBasicMaterial {
        constructor(options) {
          Object.assign(this, options);
          this.userData = {};
          this.alphaHash = false;
        }
      }
      const fakeMesh = {
        isMesh: true,
        material: fakeSourceMaterial,
        geometry: { hasAttribute: () => false },
      };
      const fakeObject = {
        userData: {},
        traverse(callback) { callback(fakeMesh); },
      };
      const materialManager = new ThreeSceneManager(null, {}, null);
      materialManager.THREE = { MeshBasicMaterial: FakeBasicMaterial, DoubleSide: 2 };
      materialManager.prepareLoadedModel(fakeObject, {
        fileName: "photogrammetry.glb",
        sourceFormat: "GLB",
        opacity: 1,
      });
      assert("UT-127 photogrammetry material is double-sided", fakeMesh.material.side === 2);
      assert("UT-128 opaque model keeps depth", fakeMesh.material.transparent === false && fakeMesh.material.depthTest === true && fakeMesh.material.depthWrite === true);
      const validationError = calculateValidationError([13, 24, 39], [10, 20, 30]);
      assert("UT-301 validation signed delta", validationError.delta.every((value, index) => close(value, [3, 4, 9][index])));
      assert("UT-302 validation 3D error", close(validationError.error3d, Math.sqrt(106)));

      const mhaLoader = new MhaLoader();
      const shortMha = createMhaBuffer({
        headerLines: [
          "ObjectType = Image",
          "NDims = 3",
          "BinaryData = True",
          "CompressedData = False",
          "DimSize = 2 2 1",
          "ElementSpacing = 0.5 0.75 1.25",
          "Offset = 10 20 30",
          "TransformMatrix = 1 0 0 0 1 0 0 0 1",
          "ElementType = MET_SHORT",
          "ElementByteOrderMSB = False",
          "ElementDataFile = LOCAL",
        ],
        values: [-10, 0, 25, 40],
        type: "int16",
      });
      const shortVolume = mhaLoader.parse(shortMha, "short.mha");
      assert("UT-201 MHA DimSize", shortVolume.metadata.dimensions.join(",") === "2,2,1");
      assert("UT-202 MHA ElementSpacing", close(shortVolume.metadata.spacing[1], 0.75));
      assert("UT-203 MHA Offset", shortVolume.metadata.origin.join(",") === "10,20,30");
      assert("UT-204 MHA TransformMatrix", shortVolume.metadata.direction[4] === 1);
      assert("UT-205 MHA MET_SHORT", shortVolume.data[2] === 25 && shortVolume.metadata.minimumValue === -10 && shortVolume.metadata.maximumValue === 40);

      const floatMha = createMhaBuffer({
        headerLines: [
          "ObjectType = Image",
          "NDims = 3",
          "BinaryData = True",
          "CompressedData = False",
          "DimSize = 2 1 1",
          "ElementSpacing = 1 1 1",
          "ElementType = MET_FLOAT",
          "ElementDataFile = LOCAL",
        ],
        values: [0.25, 1.5],
        type: "float32",
      });
      const floatVolume = mhaLoader.parse(floatMha, "float.mha");
      assert("UT-206 MHA MET_FLOAT", close(floatVolume.data[0], 0.25) && close(floatVolume.data[1], 1.5));

      const truncated = shortMha.slice(0, shortMha.byteLength - 2);
      assertThrows("UT-207 MHA binary length", () => mhaLoader.parse(truncated, "broken.mha"));
      const badType = createMhaBuffer({
        headerLines: [
          "ObjectType = Image",
          "NDims = 3",
          "BinaryData = True",
          "CompressedData = False",
          "DimSize = 1 1 1",
          "ElementSpacing = 1 1 1",
          "ElementType = MET_VECTOR",
          "ElementDataFile = LOCAL",
        ],
        values: [0],
        type: "int16",
      });
      assertThrows("UT-208 MHA unsupported type", () => mhaLoader.parse(badType, "badtype.mha"));

      document.querySelector("#output").textContent = `${lines.join("\n")}\n\n${lines.length} tests passed.`;

      function assertThrows(name, fn) {
        try {
          fn();
        } catch {
          lines.push(`PASS ${name}`);
          return;
        }
        throw new Error(`${name} failed: expected throw`);
      }

      function createMhaBuffer({ headerLines, values, type }) {
        const header = new TextEncoder().encode(`${headerLines.join("\n")}\n`);
        const bytesPerValue = type === "float32" ? 4 : 2;
        const buffer = new ArrayBuffer(header.length + values.length * bytesPerValue);
        new Uint8Array(buffer).set(header, 0);
        const view = new DataView(buffer, header.length);
        values.forEach((value, index) => {
          const offset = index * bytesPerValue;
          if (type === "float32") view.setFloat32(offset, value, true);
          else view.setInt16(offset, value, true);
        });
        return buffer;
      }
    </script>
  </body>
</html>
